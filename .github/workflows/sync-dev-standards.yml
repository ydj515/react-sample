name: Sync Development Standards

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".dev-standards/config.yaml"
  schedule:
    # Every Monday at 09:15 KST
    - cron: "15 0 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ydj515/ci-workflows/.github/workflows/sync-dev-standards.yml@v1.3.1
    with:
      standards_owner: ydj515
      standards_repo: dev-standards
      standards_ref: latest-release
      config_path: .dev-standards/config.yaml
      delivery_mode: pull-request
      bootstrap_agent_files: false
