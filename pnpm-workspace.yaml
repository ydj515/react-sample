allowBuilds:
  esbuild: true
  lefthook: true
  msw: true

# GHSA-rgw5-rvv9-x895 대응: 새 패치 버전만 최소 릴리스 경과 정책에서 제외한다.
minimumReleaseAgeExclude:
  - brace-expansion@5.0.9
  - "@vitejs/plugin-react@6.1.2"
  - lefthook-darwin-arm64@2.1.17
  - lefthook-darwin-x64@2.1.17
  - lefthook-freebsd-arm64@2.1.17
  - lefthook-freebsd-x64@2.1.17
  - lefthook-linux-arm64@2.1.17
  - lefthook-linux-x64@2.1.17
  - lefthook-openbsd-arm64@2.1.17
  - lefthook-openbsd-x64@2.1.17
  - lefthook-windows-arm64@2.1.17
  - lefthook-windows-x64@2.1.17
  - lefthook@2.1.17
  - eslint-plugin-react-refresh@0.5.8
  - msw@3.0.6

# Dependabot 보안 경보 대응: 취약한 transitive 의존성의 최소 안전 버전을 강제한다.
# minimatch 11의 matcher API와 호환되도록 glob도 함께 갱신한다.
# seroval은 기존 1.6 계열의 보안 패치로 제한한다.
overrides:
  rollup: "^4.59.0"
  flatted: "^3.4.2"
  esbuild: "^0.25.0"
  "@babel/core": "^7.29.6"
  yaml: "^2.8.3"
  minimatch: "^11.0.8"
  glob: "^14.0.6"
  seroval: "~1.6.12"
