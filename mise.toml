min_version = "2026.9.18"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[vars]
runtime_env = "local"
vite_mode = "production"

[env]
APP_ENV = "{{ vars.runtime_env }}"

[tools]
node = "24.19.0"
pnpm = "11.22.0"

[tasks."install"]
description = "Install project dependencies with pnpm."
run = "pnpm install --frozen-lockfile --prod=false"

[tasks."dev"]
description = "Generate TanStack Router routes and start the Vite dev server."
depends = ["guard:local"]
run = "pnpm dev"

[tasks."generate-routes"]
description = "Regenerate the TanStack Router route tree."
run = "pnpm generate-routes"

[tasks."watch-routes"]
description = "Watch TanStack Router route files and regenerate the route tree."
run = "pnpm watch-routes"

[tasks.typecheck]
description = "Run TypeScript project reference checks."
run = "pnpm typecheck"

[tasks.lint]
description = "Run ESLint across the project."
run = "pnpm lint"

[tasks."lint-fix"]
description = "Run ESLint and apply safe automatic fixes."
run = "pnpm lint:fix"

[tasks.format]
description = "Format project files with Prettier."
run = "pnpm format"

[tasks."format-check"]
description = "Check Prettier formatting without writing changes."
run = "pnpm format:check"

[tasks.test]
description = "Run the Vitest test suite once."
run = "pnpm test"

[tasks."test-watch"]
description = "Start Vitest in watch mode."
run = "pnpm test:watch"

[tasks.coverage]
description = "Run Vitest with coverage reporting."
run = "pnpm test:coverage"

[tasks."build"]
description = "Generate routes, typecheck, and build the production bundle."
run = "pnpm build --mode {{ vars.vite_mode | quote }}"

[tasks."storybook"]
description = "Start the Storybook dev server on port 6006."
depends = ["guard:local"]
run = "pnpm storybook"

[tasks."build-storybook"]
description = "Build the static Storybook site."
run = "pnpm build-storybook"

[tasks."test-e2e"]
description = "Run the Playwright end-to-end test suite."
run = "pnpm test:e2e"

[tasks.validate]
description = "Run the standard quality gate: typecheck, lint, format check, coverage tests, and build."
run = "pnpm validate"

[tasks.verify]
description = "Run validate, build Storybook, and execute the Playwright end-to-end suite."
run = "pnpm verify"

[tasks."bootstrap"]
description = "Install locked tools and project dependencies; do not start services"
run = "mise install --locked node@24.19.0 pnpm@11.22.0\nmise run install"

[tasks."config:check"]
description = "Validate task references without starting applications"
run = "mise tasks validate --errors-only"

[tasks."ci"]
description = "Run the repository quality gate"
run = "mise run verify"

[tasks."guard:local"]
description = "Reject local services under a production environment"
hide = true
run = "case \"$APP_ENV\" in local|dev|development) ;; *) echo 'Local services require the default or dev environment' >&2; exit 1 ;; esac"
